[project]
name = "csvcontract"
version = "1.0.0"
description = "Profile a CSV into a data contract, check new batches against it, and measure drift."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = []


[project.scripts]
csvcontract = "csvcontract.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
